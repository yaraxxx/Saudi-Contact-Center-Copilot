[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc_copilot"
version = "0.1.0"
description = "Arabic-first multimodal contact-center QA and PDPL compliance copilot"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Yara Saleh"}
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-ai-slim[google]>=2.0.0",
    "python-dotenv>=1.0.0",
    "gradio>=6.0.0",
    "requests>=2.31.0",
    "filetype>=1.2.0",
    "python-multipart>=0.0.9",
    "arize-phoenix>=12.2.0",
    "openinference-instrumentation-pydantic-ai>=0.1.7",
]

[project.scripts]
cc-copilot-api = "cc_copilot.api:main"
cc-copilot-ui = "cc_copilot.gradio_app:main"
cc-copilot = "cc_copilot.app:main"

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.setuptools.packages.find]
include = ["cc_copilot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "httpx>=0.27.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pydantic-evals>=1.1.0",
]
